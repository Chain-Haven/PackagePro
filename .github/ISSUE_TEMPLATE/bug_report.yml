name: Bug report
description: Something isn't working as expected
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please give us enough detail to reproduce it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I do X, I expect Y, but instead Z happens.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Smallest set of steps that reliably reproduces the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface is affected?
      multiple: true
      options:
        - Admin web app
        - Desktop fulfillment app
        - WooCommerce plugin
        - Customer viewer page
        - API
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Git SHA, release tag, or build version if you have it.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any error messages, console output, or screenshots. Scrub secrets first.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Sanity check
      options:
        - label: I searched existing issues and didn't find a duplicate
          required: true
        - label: I confirmed this is reproducible (not a one-off)
          required: false
